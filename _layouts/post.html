---
layout: default
---

<style>
  a.back-btn {
    display: inline-block;
    margin-bottom: 20px;
    color: #0366d6;
    text-decoration: none;
    font-weight: 600;
  }
  a.back-btn:hover { text-decoration: underline; }
  .post-body img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    margin: 15px 0;
    display: block;
  }
</style>

<a href="{{ '/instagram/' | relative_url }}" class="back-btn">← Torna all'archivio Instagram</a>

<h1>{{ page.title }}</h1>

<div class="post-body">
  {% assign abs_media = '/media/' | relative_url %}
  {{ content | replace: '../../media/', abs_media | replace: '../media/', abs_media | replace: '/other/', '/' }}
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var postDate = "{{ page.date | default: page.title }}";
  var yyyymm = postDate.replace(/[^0-9]/g, '').substring(0, 6);
  var baseUrl = "{{ '/' | relative_url }}".replace(/\/$/, '');

  document.querySelectorAll(".post-body img").forEach(function(img) {
    function tryFix() {
      var src = img.getAttribute("src") || "";
      var filename = src.split("/").pop().split("?")[0];
      if (!filename) return;

      var candidates = [];
      if (yyyymm.length === 6) {
        candidates.push(baseUrl + "/media/instagram/" + yyyymm + "/" + filename);
      }
      candidates.push(baseUrl + "/media/instagram/" + filename);
      candidates.push(baseUrl + "/media/" + filename);

      var idx = 0;
      img.onerror = function() {
        if (idx < candidates.length) {
          img.src = candidates[idx++];
        } else {
          img.onerror = null;
        }
      };
      img.onerror();
    }

    if (img.complete && img.naturalWidth === 0) {
      tryFix();
    } else {
      img.addEventListener("error", tryFix, { once: true });
    }
  });
});
</script>
