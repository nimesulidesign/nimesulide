---
layout: default
---

<style>
  a.back-btn {
    display: inline-block;
    margin-bottom: 20px;
    color: #0366d6;
    text-decoration: none;
    font-weight: 600;
  }
  a.back-btn:hover { text-decoration: underline; }
  .post-body img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    margin: 15px 0;
    display: block;
  }
</style>

<a href="{{ '/instagram/' | relative_url }}" class="back-btn">← Torna all'archivio Instagram</a>

<h1>{{ page.title }}</h1>

<div class="post-body">
  {% assign abs_media = '/media/' | relative_url %}
  {{ content | replace: '../../media/', abs_media | replace: '../media/', abs_media }}
</div>
