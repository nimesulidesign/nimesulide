<script>
  document.addEventListener("DOMContentLoaded", function() {
    document.addEventListener("contextmenu", function(e) { if (e.target.tagName === "IMG") e.preventDefault(); });
    document.addEventListener("dragstart", function(e) { if (e.target.tagName === "IMG") e.preventDefault(); });
    document.querySelectorAll("img").forEach(function(img) {
      if (!img.classList.contains("nav-icon") && !img.parentElement.classList.contains("wm-wrapper")) {
        var wrapper = document.createElement("div"); wrapper.className = "wm-wrapper";
        if (img.classList.contains("grid-img")) { wrapper.style.width = "100%"; wrapper.style.height = "180px"; }
        img.parentNode.insertBefore(wrapper, img); wrapper.appendChild(img);
        var detectBrightness = function() {
          try {
            var canvas = document.createElement("canvas"); var ctx = canvas.getContext("2d");
            canvas.width = img.naturalWidth || img.width; canvas.height = img.naturalHeight || img.height; ctx.drawImage(img, 0, 0);
            var w = Math.floor(canvas.width * 0.3); var h = Math.floor(canvas.height * 0.3);
            var imgData = ctx.getImageData(canvas.width - w, canvas.height - h, w, h).data;
            var totalLuminance = 0;
            for (var i = 0; i < imgData.length; i += 4) totalLuminance += (0.299 * imgData[i] + 0.587 * imgData[i+1] + 0.114 * imgData[i+2]);
            if ((totalLuminance / (imgData.length / 4)) < 128) wrapper.classList.add("is-dark");
          } catch(e) {}
        };
        if (img.complete) detectBrightness(); else img.onload = detectBrightness;
      }
    });
  });
</script>
